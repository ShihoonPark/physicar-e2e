[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicar-e2e"
version = "0.1.0"
description = "Reproducible PhysiCar end-to-end driving research tools"
requires-python = ">=3.11"
dependencies = [
  "mcap>=1.3,<2",
  "mcap-ros2-support>=0.5,<1",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
pilotnet = [
  "matplotlib==3.11.1",
  "numpy==2.4.6",
  "onnx==1.22.0",
  "onnxruntime==1.29.0",
  "torch==2.13.0",
]

[project.scripts]
physicar-expert-v1 = "physicar_e2e.expert_driver:main"
physicar-rosbag-collector-v1 = "physicar_e2e.rosbag_collector:main"
physicar-dataset-extractor-v1 = "physicar_e2e.dataset_extractor:main"
physicar-pilotnet-train-v1 = "physicar_e2e.pilotnet_training:main"
physicar-pilotnet-inference-v1 = "physicar_e2e.pilotnet_inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
