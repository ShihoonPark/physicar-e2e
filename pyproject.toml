[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicar-e2e"
version = "0.1.0"
description = "Reproducible PhysiCar end-to-end driving research tools"
requires-python = ">=3.11"
dependencies = [
  "mcap>=1.3,<2",
  "mcap-ros2-support>=0.5,<1",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
pilotnet = [
  "matplotlib==3.11.1",
  "numpy==2.4.6",
  "onnx==1.22.0",
  "onnxruntime==1.29.0",
  "torch==2.13.0",
]

[project.scripts]
physicar-expert-v1 = "physicar_e2e.expert_driver:main"
physicar-rosbag-collector-v1 = "physicar_e2e.rosbag_collector:main"
physicar-dataset-extractor-v1 = "physicar_e2e.dataset_extractor:main"
physicar-pilotnet-train-v1 = "physicar_e2e.pilotnet_training:main"
physicar-pilotnet-inference-v1 = "physicar_e2e.pilotnet_inference:main"
physicar-recovery-data-v1 = "physicar_e2e.recovery_data:main"
physicar-pilotnet-train-v2-recovery = "physicar_e2e.pilotnet_recovery_training:main"
physicar-pilotnet-run-v2-recovery = "physicar_e2e.pilotnet_recovery_inference:main"
physicar-pilotnet-failure-diagnosis-v1 = "physicar_e2e.pilotnet_failure_diagnosis:main"
physicar-pilotnet-dagger-v1 = "physicar_e2e.pilotnet_dagger:main"
physicar-pilotnet-train-v3-dagger = "physicar_e2e.pilotnet_dagger_training:main"
physicar-pilotnet-run-v3-dagger = "physicar_e2e.pilotnet_dagger_inference:main"
physicar-pilotnet-dagger-iteration2-v1 = "physicar_e2e.pilotnet_dagger_iteration2:main"
physicar-pilotnet-train-v4-dagger = "physicar_e2e.pilotnet_dagger_iteration2_training:main"
physicar-pilotnet-run-v4-dagger = "physicar_e2e.pilotnet_dagger_iteration2_inference:main"
physicar-pilotnet-v4-repeatability-v1 = "physicar_e2e.pilotnet_v4_repeatability:main"
physicar-pilotnet-pi5-infer = "physicar_e2e.pilotnet_pi5:main"
physicar-real-runtime-v1 = "physicar_e2e.real_runtime:main"
physicar-real-runtime-ros2-v1 = "physicar_e2e.real_runtime_ros2:main"
physicar-random-cone-expert-v1 = "physicar_e2e.random_cone_expert:main"
physicar-random-cone-expert-1p0-v1 = "physicar_e2e.random_cone_expert:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
