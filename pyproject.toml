[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicar-e2e"
version = "0.1.0"
description = "Reproducible PhysiCar end-to-end driving research tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
physicar-expert-v1 = "physicar_e2e.expert_driver:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
